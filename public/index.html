<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .chat-container { width: 100%; max-width: 500px; background: #1e1e1e; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px; border-radius: 12px; max-width: 85%; line-height: 1.5; word-wrap: break-word; }
        .user { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 15px; background: #252525; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #333; color: white; outline: none; }
        button { margin-left: 10px; padding: 10px 20px; background: #2563eb; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="chat-window"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Frag mich was..." autocomplete="off">
            <button id="sendBtn">Senden</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function send() {
            const text = userInput.value.trim();
            if(!text) return;

            // User Nachricht anzeigen
            chatWindow.innerHTML += `<div class="msg user">${text}</div>`;
            userInput.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await res.json();

                // HIER WIRD GEPRÜFT: Falls data.reply existiert, nimm es, sonst Fehlermeldung
                const botAntwort = data.reply || "Fehler: Ungültige Antwort vom Server.";
                chatWindow.innerHTML += `<div class="msg bot">${botAntwort}</div>`;

            } catch (e) {
                chatWindow.innerHTML += `<div class="msg bot" style="color: #ff4444;">Netzwerkfehler: Server nicht erreichbar.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        sendBtn.addEventListener('click', send);
        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
